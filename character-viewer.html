<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>角色预览 - 动作检查</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a2027; color: #d5d5ce; font-family: system-ui, sans-serif; }
  #hud { position: fixed; top: 12px; left: 12px; z-index: 2; display: flex; gap: 8px; align-items: center; }
  #hud button { background: #1b1e1c; color: #d5d5ce; border: 1px solid #494d46; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  #hud button.active { background: #c9a55b; color: #111; }
  #status { position: fixed; bottom: 12px; left: 12px; z-index: 2; font-size: 13px; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px; white-space: pre; }
  #error { position: fixed; top: 56px; left: 12px; z-index: 3; color: #ff7a7a; font-size: 13px; white-space: pre-wrap; max-width: 60vw; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="hud">
  <button data-anim="idle" class="active">待机</button>
  <button data-anim="walk">走路</button>
  <button data-anim="run">跑步</button>
  <button data-anim="idleAlt">待机2</button>
  <span id="fps" style="margin-left:12px;opacity:.7"></span>
</div>
<div id="error"></div>
<div id="status">加载中…</div>

<script type="module" src="./character-viewer.js"></script>
</body>
</html>
